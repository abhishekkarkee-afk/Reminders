<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Office Tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column. A sunny yellow panel on top says in plain words what is overdue and due, with a seven-day runway inside it. Flat colour, thick ink edges and hard offset shadows give it a sticker feel; urgency colours tint the rows. */
:root {
  --bg: #ece7ff;
  --surface: #ffffff;
  --field: #f6f3ff;
  --fg: #1a1530;
  --muted: #5b5480;
  --line: #d6cff3;
  --edge: #1a1530;
  --accent: #5b3df5;
  --accent-fg: #ffffff;
  --hero: #5433ee;
  --hero-fg: #ffffff;
  --hero-soft: rgba(255, 255, 255, .85);
  --urgent: #d92d2d;
  --urgent-bg: #ffdede;
  --high: #b45a00;
  --high-bg: #ffe6c2;
  --normal: #2457d6;
  --normal-bg: #dce6ff;
  --low: #5b5480;
  --low-bg: #e8e4fa;
  --f-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14102b; --surface: #211a42; --field: #14102b; --fg: #f3efff; --muted: #a9a1d3; --line: #3a3068; --edge: #7d6ff2;
    --accent: #ab9eff; --accent-fg: #1a1240; --hero: #5433ee; --hero-fg: #ffffff; --hero-soft: rgba(255, 255, 255, .85);
    --urgent: #ff8080; --urgent-bg: #4a2030; --high: #ffb457; --high-bg: #47311a;
    --normal: #94b4ff; --normal-bg: #1d2c5e; --low: #a9a1d3; --low-bg: #2d2654;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14102b; --surface: #211a42; --field: #14102b; --fg: #f3efff; --muted: #a9a1d3; --line: #3a3068; --edge: #7d6ff2;
  --accent: #ab9eff; --accent-fg: #1a1240; --hero: #5433ee; --hero-fg: #ffffff; --hero-soft: rgba(255, 255, 255, .85);
  --urgent: #ff8080; --urgent-bg: #4a2030; --high: #ffb457; --high-bg: #47311a;
  --normal: #94b4ff; --normal-bg: #1d2c5e; --low: #a9a1d3; --low-bg: #2d2654;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--f-body);
  padding-inline: 16px;
  padding-block: 22px 80px;
}
.app { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- hero ---------- */
.hero { background: var(--hero); color: var(--hero-fg); border: 2px solid var(--edge); border-radius: 20px; box-shadow: 6px 6px 0 var(--edge); padding: 18px 18px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero :focus-visible { outline-color: var(--hero-fg); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { margin: 0; font: 700 12px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }
.top .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.donepill { background: var(--hero-fg); color: var(--hero); border: 2px solid var(--hero-fg); border-radius: 999px; padding: 4px 11px; font: 700 12px/1 var(--f-mono); letter-spacing: .04em; transform: rotate(-3deg); }
.date { margin: 0; font: 500 12px/1.2 var(--f-mono); letter-spacing: .05em; color: var(--hero-soft); }
.headline { margin: 6px 0 0; font: 900 clamp(36px, 9vw, 64px)/.96 var(--f-display); font-stretch: 112%; letter-spacing: -.04em; text-wrap: balance; }
.headline .num { display: inline-block; background: var(--hero-fg); color: var(--hero); border-radius: 10px; padding: 0 .16em; margin-right: .06em; font-variant-numeric: tabular-nums; transform: rotate(-2.5deg); }
.headline .num + .num { transform: rotate(2deg); }
.sub { margin: 0; font-size: 16px; font-weight: 500; color: var(--hero-fg); max-width: 60ch; overflow-wrap: anywhere; }
.sub b { font-weight: 800; }
.save { font: 500 11.5px/1.2 var(--f-mono); color: var(--hero-soft); }
.save[data-state="error"] { color: var(--hero-fg); font-weight: 700; text-decoration: underline wavy; text-underline-offset: 3px; }

.runway { display: flex; gap: 10px; overflow-x: auto; padding: 3px 5px 8px 3px; margin: -3px -5px -8px -3px; scrollbar-width: thin; }
.day { flex: 1 0 86px; min-width: 86px; background: var(--surface); color: var(--fg); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--edge); padding: 9px 10px 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; transition: transform .12s ease, box-shadow .12s ease; }
.day:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--edge); }
.day:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
.day[aria-pressed="true"] { outline: 3px solid var(--hero-fg); outline-offset: 2px; }
.day .dow { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .dnum { font: 900 30px/1 var(--f-display); font-stretch: 112%; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.day .dots { display: flex; flex-wrap: wrap; gap: 5px; min-height: 13px; align-items: center; }
.dot { width: 13px; height: 13px; border-radius: 4px; background: var(--low); border: 2px solid var(--edge); flex: none; }
.dot.urgent { background: var(--urgent); }
.dot.high { background: var(--high); }
.dot.normal { background: var(--normal); }
.dot.low { background: var(--low); }
.dot.hard { border-radius: 50%; }
.day .free { font: 500 11.5px/1 var(--f-mono); color: var(--muted); }
.day .more { font: 600 11px/1 var(--f-mono); color: var(--muted); }
.day.today { box-shadow: 3px 3px 0 var(--edge), inset 0 -7px 0 var(--accent); padding-bottom: 14px; }
.day.today:hover { box-shadow: 4px 4px 0 var(--edge), inset 0 -7px 0 var(--accent); }
.day.today .dow { color: var(--accent); font-weight: 700; }
.day.over { background: var(--urgent-bg); }
.day.over .dow, .day.over .dnum { color: var(--urgent); }
.day.over.zero { background: var(--surface); }
.day.over.zero .dow, .day.over.zero .dnum { color: var(--muted); }

/* ---------- form ---------- */
.add { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--edge); padding: 18px; display: grid; gap: 15px; }
.add h2 { margin: 0; font: 900 24px/1.1 var(--f-display); font-stretch: 112%; letter-spacing: -.03em; }
.field-label { display: block; font: 600 11.5px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.add input[type="text"], .add input[type="date"], .add input[type="time"] {
  width: 100%; min-width: 0; background: var(--field); border: 2px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--fg);
}
.add input[type="text"]:focus, .add input[type="date"]:focus, .add input[type="time"]:focus { border-color: var(--accent); outline: none; }
#f-title { font-size: 17.5px; font-weight: 600; padding-block: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.row > * { min-width: 0; }
.when { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.when .date-in { width: 160px; }
.when .time-in { width: 120px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button, .ghost { background: transparent; border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.quick button:hover, .ghost:hover { color: var(--accent); border-color: var(--accent); }
.hard-opt { display: flex; align-items: center; gap: 8px; padding-block: 9px; font-size: 14px; font-weight: 600; }
.hard-opt input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.hard-opt small { color: var(--muted); font-weight: 400; }

.seg { display: inline-flex; border: 2px solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--field); position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 9px 16px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-right: 2px solid var(--edge); }
.seg label:last-of-type { border-right: 0; }
.seg label:hover { color: var(--fg); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: -3px; }
.seg input.urgent:checked + label { background: var(--urgent); color: var(--surface); }
.seg input.high:checked + label { background: var(--high); color: var(--surface); }
.seg input.normal:checked + label { background: var(--normal); color: var(--surface); }
.seg input.low:checked + label { background: var(--low); color: var(--surface); }

.actions { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.actions .grow { flex: 1 1 220px; min-width: 0; }
.primary { background: var(--accent); color: var(--accent-fg); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--edge); padding: 11px 22px; font-weight: 800; font-size: 15px; transition: transform .1s ease, box-shadow .1s ease; }
.primary:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--edge); }
.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
.err { margin: 0; color: var(--urgent); font-size: 13.5px; font-weight: 700; }

/* ---------- filters ---------- */
.filters { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.filters .lbl { font: 600 11.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.filters button { background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: var(--fg); }
.filters button:hover { background: var(--field); }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.filters .daychip { background: var(--hero); color: var(--hero-fg); }

/* ---------- task groups ---------- */
.group { display: flex; flex-direction: column; gap: 11px; }
.group h2 { margin: 0; display: flex; gap: 10px; align-items: center; font: 900 25px/1.1 var(--f-display); font-stretch: 112%; letter-spacing: -.03em; }
.group h2::before { content: ""; width: 17px; height: 17px; border: 2px solid var(--edge); border-radius: 5px; background: var(--low); flex: none; transform: rotate(-6deg); }
.group.overdue h2::before { background: var(--urgent); }
.group.today h2::before { background: var(--accent); }
.group.tomorrow h2::before { background: var(--high); }
.group.week h2::before { background: var(--normal); }
.group.later h2::before { background: var(--low); }
.group.none h2::before { background: transparent; }
.group h2 .c { font: 600 12px/1 var(--f-mono); letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.group.overdue h2 { color: var(--urgent); }
ul.tasks { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--edge); overflow: hidden; }
li.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 15px 16px; align-items: start; border-bottom: 2px solid var(--line); }
li.task:last-child { border-bottom: 0; }
li.task.u-urgent { background: color-mix(in srgb, var(--urgent-bg) 75%, var(--surface)); }
li.task.u-high { background: color-mix(in srgb, var(--high-bg) 70%, var(--surface)); }
li.task.done { background: var(--surface); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--low); background: var(--surface); padding: 0; position: relative; flex: none; transition: transform .1s ease; }
.u-urgent .check { border-color: var(--urgent); }
.u-high .check { border-color: var(--high); }
.u-normal .check { border-color: var(--normal); }
.u-low .check { border-color: var(--low); }
.check:hover { transform: scale(1.12); }
.done .check { background: var(--accent); border-color: var(--accent); }
.done .check::after { content: ""; position: absolute; left: 8px; top: 3px; width: 7px; height: 13px; border: solid var(--accent-fg); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.body { min-width: 0; }
.title { font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.done .title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 5px; font-size: 13px; color: var(--muted); }
.due { font: 500 12.5px/1.4 var(--f-mono); font-variant-numeric: tabular-nums; }
.is-overdue .due { color: var(--urgent); font-weight: 700; }
.hard { font: 700 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; background: var(--fg); color: var(--bg); border-radius: 5px; padding: 4px 7px; transform: rotate(-1.5deg); }
.notes { margin-top: 5px; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip { font: 700 11px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; border-radius: 999px; padding: 5px 11px; }
.chip.urgent { background: var(--urgent); color: var(--surface); }
.chip.high { background: var(--high); color: var(--surface); }
.chip.normal { background: var(--normal-bg); color: var(--normal); }
.chip.low { background: var(--low-bg); color: var(--low); }
.row-actions { display: flex; gap: 6px; align-items: center; }
.row-actions button { background: transparent; border: 0; padding: 4px 7px; font-size: 13px; font-weight: 600; color: var(--muted); border-radius: 6px; }
.row-actions button:hover { color: var(--accent); background: var(--field); }
.row-actions .danger:hover { color: var(--urgent); }
.row-actions .yes { color: var(--urgent); font-weight: 800; }
.row-actions .q { font-size: 13px; color: var(--fg); font-weight: 600; }

details.completed { margin-top: 4px; }
details.completed summary { cursor: pointer; font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 6px; }
details.completed .bar { display: flex; gap: 10px; align-items: center; padding-block: 6px 12px; font-size: 13px; color: var(--muted); }

.empty { background: var(--surface); border: 2px dashed var(--edge); border-radius: 18px; padding: 30px 22px; }
.empty h2 { margin: 0 0 6px; font: 900 26px/1.1 var(--f-display); font-stretch: 112%; letter-spacing: -.03em; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }

.confetti { position: fixed; width: 8px; height: 13px; border-radius: 2px; pointer-events: none; z-index: 50; animation: fly .85s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes fly {
  from { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 46px)) rotate(var(--rot)); opacity: 0; }
}

@media (max-width: 520px) {
  li.task { grid-template-columns: auto minmax(0, 1fr); }
  .side { grid-column: 2; flex-direction: row-reverse; justify-content: space-between; align-items: center; width: 100%; }
  .seg { width: 100%; }
  .seg label { flex: 1; text-align: center; padding-inline: 6px; }
  .when .date-in, .when .time-in { width: calc(50% - 4px); }
  .group h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .headline .num, .donepill, .hard { transform: none !important; } }
</style>

</head>
<body>
<div class="app">
  <section class="hero" aria-label="Today at a glance">
    <div class="top">
      <h1 class="brand">Office Tasks</h1>
      <div class="right">
        <span class="donepill" id="donePill" hidden></span>
        <div class="save" id="saveState" role="status" data-state="connecting">Connecting…</div>
      </div>
    </div>
    <div>
      <p class="date" id="today">&nbsp;</p>
      <h2 class="headline" id="headline">Loading your tasks</h2>
    </div>
    <p class="sub" id="subline"></p>
    <div class="runway" id="runway" role="group" aria-label="Next seven days. Select a day to show only its tasks."></div>
  </section>

  <form class="add" id="form" autocomplete="off" novalidate>
    <h2 id="formTitle">New task</h2>
    <div>
      <label class="field-label" for="f-title">Task</label>
      <input type="text" id="f-title" maxlength="200" placeholder="What needs doing?">
    </div>
    <div>
      <span class="field-label" id="urg-label">How urgent</span>
      <div class="seg" role="radiogroup" aria-labelledby="urg-label">
        <input type="radio" name="urgency" id="u-urgent" value="urgent" class="urgent"><label for="u-urgent">Urgent</label>
        <input type="radio" name="urgency" id="u-high" value="high" class="high"><label for="u-high">High</label>
        <input type="radio" name="urgency" id="u-normal" value="normal" class="normal" checked><label for="u-normal">Normal</label>
        <input type="radio" name="urgency" id="u-low" value="low" class="low"><label for="u-low">Low</label>
      </div>
    </div>
    <div class="row">
      <div class="when">
        <div class="date-in">
          <label class="field-label" for="f-due">Deadline</label>
          <input type="date" id="f-due">
        </div>
        <div class="time-in">
          <label class="field-label" for="f-time">Time (optional)</label>
          <input type="time" id="f-time" disabled>
        </div>
        <div class="quick" aria-label="Quick dates">
          <button type="button" data-quick="0">Today</button>
          <button type="button" data-quick="1">Tomorrow</button>
          <button type="button" data-quick="fri">Friday</button>
        </div>
      </div>
      <label class="hard-opt" for="f-hard">
        <input type="checkbox" id="f-hard">
        <span>Hard deadline <small>(cannot slip)</small></span>
      </label>
    </div>
    <div class="actions">
      <div class="grow">
        <label class="field-label" for="f-notes">Notes (optional)</label>
        <input type="text" id="f-notes" maxlength="500" placeholder="Who to call, which file, what to attach">
      </div>
      <button type="submit" class="primary" id="f-submit">Add task</button>
      <button type="button" class="ghost" id="f-cancel" hidden>Cancel</button>
    </div>
    <p class="err" id="f-err" role="alert" hidden></p>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks" id="filters">
    <span class="lbl">Show</span>
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="priority" aria-pressed="false">Urgent and high</button>
    <button type="button" data-f="hard" aria-pressed="false">Hard deadlines</button>
    <button type="button" class="daychip" id="dayChip" hidden></button>
  </div>

  <main id="list"></main>
</div>

<script>
(function () {
  var RANK = { urgent: 0, high: 1, normal: 2, low: 3 };
  var LABEL = { urgent: 'Urgent', high: 'High', normal: 'Normal', low: 'Low' };
  var GROUPS = [
    { key: 'overdue', label: 'Overdue', by: 'urgency' },
    { key: 'today', label: 'Today', by: 'urgency' },
    { key: 'tomorrow', label: 'Tomorrow', by: 'urgency' },
    { key: 'week', label: 'Next 7 days', by: 'due' },
    { key: 'later', label: 'Later', by: 'due' },
    { key: 'none', label: 'No deadline', by: 'urgency' }
  ];

  var col = null;
  var tasks = [];
  var loaded = false;
  var filter = 'all';
  var dayFilter = null;    // null | 'overdue' | 'YYYY-MM-DD'
  var editingId = null;
  var confirmDelId = null;
  var confirmClear = false;
  var doneOpen = false;
  var LS_KEY = 'officeTasks.v1';
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); }
    catch (e) { setStatus('error', 'Could not save on this device.'); }
  }

  var $ = function (id) { return document.getElementById(id); };
  var todayEl = $('today'), saveEl = $('saveState'), listEl = $('list'), headEl = $('headline'), subEl = $('subline'),
      runwayEl = $('runway'), dayChip = $('dayChip'), formTitle = $('formTitle'), donePill = $('donePill');
  var form = $('form'), fTitle = $('f-title'), fDue = $('f-due'), fTime = $('f-time'), fHard = $('f-hard'),
      fNotes = $('f-notes'), fSubmit = $('f-submit'), fCancel = $('f-cancel'), fErr = $('f-err');

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }

  /* ---------- dates ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDue(t) {
    if (!t.due) return null;
    var p = t.due.split('-').map(Number);
    var hasTime = !!t.time, hh = 23, mm = 59;
    if (hasTime) { var q = t.time.split(':').map(Number); hh = q[0]; mm = q[1]; }
    return { date: new Date(p[0], p[1] - 1, p[2]), at: new Date(p[0], p[1] - 1, p[2], hh, mm), hasTime: hasTime };
  }
  function dayDiff(date, now) {
    var a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((date - a) / 86400000);
  }
  function fmtTime(s) {
    var p = s.split(':').map(Number), h12 = p[0] % 12 || 12;
    return h12 + ':' + pad(p[1]) + ' ' + (p[0] < 12 ? 'am' : 'pm');
  }
  function fmtDate(d, now) {
    var o = { weekday: 'short', day: 'numeric', month: 'short' };
    if (d.getFullYear() !== now.getFullYear()) o.year = 'numeric';
    return d.toLocaleDateString('en-AU', o);
  }
  function info(t, now) {
    var p = parseDue(t);
    if (!p) return { g: 'none', p: null, diff: null };
    var diff = dayDiff(p.date, now), g;
    if (diff < 0 || (diff === 0 && p.hasTime && p.at < now)) g = 'overdue';
    else if (diff === 0) g = 'today';
    else if (diff === 1) g = 'tomorrow';
    else if (diff <= 7) g = 'week';
    else g = 'later';
    return { g: g, p: p, diff: diff };
  }
  function dueText(t, x, now) {
    if (!x.p) return 'No deadline';
    var tm = x.p.hasTime ? ' · ' + fmtTime(t.time) : '';
    if (x.diff < 0) return fmtDate(x.p.date, now) + tm + ' · ' + (-x.diff) + (x.diff === -1 ? ' day' : ' days') + ' overdue';
    if (x.diff === 0) return 'Today' + tm + (x.g === 'overdue' ? ' · time has passed' : '');
    if (x.diff === 1) return 'Tomorrow' + tm;
    if (x.diff <= 7) return fmtDate(x.p.date, now) + tm + ' · in ' + x.diff + ' days';
    return fmtDate(x.p.date, now) + tm;
  }

  /* ---------- storage ---------- */
  function setStatus(state, text) { saveEl.dataset.state = state; saveEl.textContent = text; }
  function errText(e) {
    if (e && e.code === 'invalid_argument') return 'Not saved. This account cannot change the list.';
    if (e && e.code === 'quota_exceeded') return 'Not saved. Storage is full. Delete some completed tasks.';
    return 'Not saved. Try again.';
  }
  function localId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  async function writeTask(id, data) {
    if (!col) {
      var i = tasks.findIndex(function (t) { return t.id === id; });
      var rec = Object.assign({ id: id }, data);
      if (i >= 0) tasks[i] = rec; else tasks.push(rec);
      saveLocal(); render(); return;
    }
    setStatus('saving', 'Saving…');
    try { await col.doc(id).set(data); setStatus('saved', 'Saved'); }
    catch (e) { setStatus('error', errText(e)); }
  }
  async function patchTask(id, patch) {
    if (!col) {
      var t = tasks.find(function (x) { return x.id === id; });
      if (t) Object.assign(t, patch);
      saveLocal(); render(); return;
    }
    setStatus('saving', 'Saving…');
    try { await col.doc(id).update(patch); setStatus('saved', 'Saved'); }
    catch (e) { setStatus('error', errText(e)); }
  }
  async function removeTasks(ids) {
    if (!col) {
      tasks = tasks.filter(function (t) { return ids.indexOf(t.id) < 0; });
      saveLocal(); render(); return;
    }
    setStatus('saving', 'Saving…');
    try {
      for (var i = 0; i < ids.length; i++) await col.doc(ids[i]).delete();
      setStatus('saved', 'Saved');
    } catch (e) { setStatus('error', errText(e)); }
  }

  /* ---------- celebration ---------- */
  function burst(el) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var colors = ['#ffd23f', '#5b3df5', '#ff5a8a', '#1fc3a4', '#ff8a00'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      var ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 60;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.background = colors[i % colors.length];
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist - 24 + 'px');
      s.style.setProperty('--rot', (Math.random() * 600 - 300) + 'deg');
      document.body.appendChild(s);
      setTimeout((function (n) { return function () { n.remove(); }; })(s), 900);
    }
  }

  /* ---------- form ---------- */
  function showErr(msg) { fErr.textContent = msg; fErr.hidden = !msg; }
  function syncTime() {
    fTime.disabled = !fDue.value;
    if (!fDue.value) fTime.value = '';
  }
  function resetForm() {
    editingId = null;
    form.reset();
    $('u-normal').checked = true;
    syncTime(); showErr('');
    fSubmit.textContent = 'Add task';
    formTitle.textContent = 'New task';
    fCancel.hidden = true;
  }
  function startEdit(t) {
    editingId = t.id; confirmDelId = null;
    fTitle.value = t.title || '';
    var r = form.querySelector('input[name=urgency][value=' + (t.urgency || 'normal') + ']');
    if (r) r.checked = true;
    fDue.value = t.due || ''; syncTime();
    fTime.value = t.time || '';
    fHard.checked = !!t.hard;
    fNotes.value = t.notes || '';
    fSubmit.textContent = 'Save changes';
    formTitle.textContent = 'Edit task';
    fCancel.hidden = false; showErr('');
    render();
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    fTitle.focus();
  }

  fDue.addEventListener('input', syncTime);
  fDue.addEventListener('change', syncTime);
  fCancel.addEventListener('click', resetForm);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editingId) { resetForm(); render(); } });
  form.querySelector('.quick').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-quick]');
    if (!b) return;
    var d = new Date();
    if (b.dataset.quick === 'fri') d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7));
    else d.setDate(d.getDate() + Number(b.dataset.quick));
    fDue.value = ymd(d); syncTime();
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var title = fTitle.value.trim();
    if (!title) { showErr('Give the task a name first.'); fTitle.focus(); return; }
    if (fHard.checked && !fDue.value) { showErr('Pick a date for a hard deadline.'); fDue.focus(); return; }
    showErr('');
    var existing = editingId ? tasks.find(function (t) { return t.id === editingId; }) : null;
    var data = {
      title: title,
      urgency: form.querySelector('input[name=urgency]:checked').value,
      due: fDue.value,
      time: fDue.value ? fTime.value : '',
      hard: fHard.checked,
      notes: fNotes.value.trim(),
      done: existing ? !!existing.done : false,
      doneAt: existing ? (existing.doneAt || null) : null,
      created: existing && existing.created ? existing.created : new Date().toISOString()
    };
    var id = editingId || (col ? col.doc().id : localId());
    resetForm();
    await writeTask(id, data);
    fTitle.focus();
  });

  /* ---------- filters ---------- */
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-f]');
    if (!b) return;
    filter = b.dataset.f;
    $('filters').querySelectorAll('button[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  dayChip.addEventListener('click', function () { dayFilter = null; render(); });
  function passes(o) {
    if (filter === 'priority' && !(o.t.urgency === 'urgent' || o.t.urgency === 'high')) return false;
    if (filter === 'hard' && !o.t.hard) return false;
    if (dayFilter === 'overdue') return o.x.g === 'overdue';
    if (dayFilter) return o.t.due === dayFilter && o.x.g !== 'overdue';
    return true;
  }

  /* ---------- render pieces ---------- */
  function cmp(by) {
    return function (a, b) {
      var ur = (RANK[a.t.urgency] - RANK[b.t.urgency]);
      var da = a.x.p && b.x.p ? a.x.p.at - b.x.p.at : 0;
      var cr = String(a.t.created || '').localeCompare(String(b.t.created || ''));
      if (by === 'due') return da || ur || cr;
      return ur || da || cr;
    };
  }
  function num(n) { return h('span', { class: 'num' }, String(n)); }

  function renderHero(open, cnt, now) {
    var hr = now.getHours();
    var greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
    todayEl.textContent = greet + ' · ' + now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    var doneToday = tasks.filter(function (t) { return t.done && t.doneAt && ymd(new Date(t.doneAt)) === ymd(now); }).length;
    donePill.hidden = !doneToday;
    donePill.textContent = doneToday + ' done today';

    var head = [], sub = [];
    if (!loaded) { head.push('Loading your tasks'); }
    else if (!tasks.length) { head.push('Nothing to forget yet.'); sub.push('Add your first task below. Give it an urgency and a date, and this panel will tell you what needs you first.'); }
    else if (!open.length) { head.push('All clear.'); sub.push('Nothing open right now. Go get a coffee, then add the next thing before it slips your mind.'); }
    else {
      if (cnt.overdue) head.push(num(cnt.overdue), ' overdue. ');
      if (cnt.today) head.push(num(cnt.today), ' due today.');
      if (!cnt.overdue && !cnt.today) head.push('Nothing due today.');
      var dated = open.filter(function (o) { return o.x.p; }).sort(function (a, b) { return a.x.p.at - b.x.p.at; });
      var hards = dated.filter(function (o) { return o.t.hard; });
      if (hards.length) {
        var o = hards[0];
        sub.push(o.x.g === 'overdue' ? 'Hard deadline missed: ' : 'Next hard deadline: ', h('b', null, o.t.title), ' · ' + dueText(o.t, o.x, now));
      } else {
        var nx = dated.filter(function (o) { return o.x.g !== 'overdue'; })[0];
        if (nx) sub.push('Next due: ', h('b', null, nx.t.title), ' · ' + dueText(nx.t, nx.x, now));
        else if (!dated.length) sub.push('None of your open tasks has a date yet. Add dates and they will line up by deadline.');
      }
    }
    headEl.replaceChildren.apply(headEl, head);
    subEl.replaceChildren.apply(subEl, sub);
    subEl.hidden = !sub.length;
  }

  function renderRunway(open, cnt, now) {
    var cells = [];
    cells.push(h('button', {
      type: 'button', class: 'day over' + (cnt.overdue ? '' : ' zero'), 'aria-pressed': String(dayFilter === 'overdue'),
      'aria-label': cnt.overdue + ' overdue',
      onclick: function () { dayFilter = dayFilter === 'overdue' ? null : 'overdue'; render(); }
    },
      h('span', { class: 'dow' }, 'Overdue'),
      h('span', { class: 'dnum' }, String(cnt.overdue)),
      h('span', { class: cnt.overdue ? 'more' : 'free' }, cnt.overdue ? 'Catch up' : 'None')));
    for (var i = 0; i < 7; i++) {
      (function (i) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        var key = ymd(d);
        var items = open.filter(function (o) { return o.t.due === key && o.x.g !== 'overdue'; })
          .sort(function (a, b) { return RANK[a.t.urgency] - RANK[b.t.urgency]; });
        var shown = items.slice(0, 5);
        var dots = shown.map(function (o) {
          return h('span', { class: 'dot ' + o.t.urgency + (o.t.hard ? ' hard' : ''), title: o.t.title });
        });
        if (items.length > shown.length) dots.push(h('span', { class: 'more' }, '+' + (items.length - shown.length)));
        var lab = (i === 0 ? 'Today' : d.toLocaleDateString('en-AU', { weekday: 'short' }));
        cells.push(h('button', {
          type: 'button', class: 'day' + (i === 0 ? ' today' : ''), 'aria-pressed': String(dayFilter === key),
          'aria-label': d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }) + ': ' + items.length + (items.length === 1 ? ' task' : ' tasks'),
          onclick: function () { dayFilter = dayFilter === key ? null : key; render(); }
        },
          h('span', { class: 'dow' }, lab),
          h('span', { class: 'dnum' }, String(d.getDate())),
          items.length ? h.apply(null, ['span', { class: 'dots' }].concat(dots)) : h('span', { class: 'free' }, 'Free')));
      })(i);
    }
    runwayEl.replaceChildren.apply(runwayEl, cells);

    if (dayFilter) {
      dayChip.hidden = false;
      var lbl = dayFilter === 'overdue' ? 'Overdue only' : new Date(dayFilter + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
      dayChip.textContent = lbl + '  ✕';
      dayChip.setAttribute('aria-label', 'Showing ' + lbl + '. Clear day filter.');
    } else dayChip.hidden = true;
  }

  function taskRow(t, x, now, isDone) {
    var overdue = !isDone && x.g === 'overdue';
    var side;
    if (confirmDelId === t.id) {
      side = h('div', { class: 'row-actions' },
        h('span', { class: 'q' }, 'Delete this task?'),
        h('button', { type: 'button', class: 'yes', onclick: function () { confirmDelId = null; removeTasks([t.id]); } }, 'Delete'),
        h('button', { type: 'button', onclick: function () { confirmDelId = null; render(); } }, 'Keep'));
    } else {
      side = h('div', { class: 'row-actions' },
        h('button', { type: 'button', onclick: function () { startEdit(t); } }, 'Edit'),
        h('button', { type: 'button', class: 'danger', onclick: function () { confirmDelId = t.id; render(); } }, 'Delete'));
    }
    return h('li', { class: 'task u-' + t.urgency + (isDone ? ' done' : '') + (overdue ? ' is-overdue' : '') },
      h('button', {
        type: 'button', class: 'check', 'aria-pressed': String(!!t.done),
        'aria-label': (t.done ? 'Mark not done: ' : 'Mark done: ') + t.title,
        onclick: function (ev) {
          if (!t.done) burst(ev.currentTarget);
          patchTask(t.id, t.done ? { done: false, doneAt: null } : { done: true, doneAt: new Date().toISOString() });
        }
      }),
      h('div', { class: 'body' },
        h('div', { class: 'title' }, t.title),
        h('div', { class: 'meta' },
          h('span', { class: 'due' }, dueText(t, x, now)),
          t.hard && !isDone ? h('span', { class: 'hard' }, 'Hard deadline') : null),
        t.notes ? h('div', { class: 'notes' }, t.notes) : null),
      h('div', { class: 'side' },
        h('span', { class: 'chip ' + t.urgency }, LABEL[t.urgency] || 'Normal'),
        side));
  }

  function render() {
    var now = new Date();
    tasks.forEach(function (t) { if (!RANK.hasOwnProperty(t.urgency)) t.urgency = 'normal'; });
    var open = tasks.filter(function (t) { return !t.done; }).map(function (t) { return { t: t, x: info(t, now) }; });
    var done = tasks.filter(function (t) { return t.done; });

    var cnt = { overdue: 0, today: 0 };
    open.forEach(function (o) { if (o.x.g === 'overdue') cnt.overdue++; else if (o.x.g === 'today') cnt.today++; });
    renderHero(open, cnt, now);
    renderRunway(open, cnt, now);

    var out = [];
    if (tasks.length === 0) {
      out.push(h('div', { class: 'empty' },
        h('h2', null, loaded ? 'Your list is empty' : 'Loading your tasks'),
        h('p', null, 'Tasks with a date sort themselves by deadline and turn red once they are overdue. Tasks without one wait at the bottom until you give them a day.')));
    } else {
      var shown = open.filter(passes);
      GROUPS.forEach(function (g) {
        var items = shown.filter(function (o) { return o.x.g === g.key; }).sort(cmp(g.by));
        if (!items.length) return;
        out.push(h('section', { class: 'group ' + g.key },
          h('h2', null, g.label, h('span', { class: 'c' }, String(items.length))),
          h.apply(null, ['ul', { class: 'tasks' }].concat(items.map(function (o) { return taskRow(o.t, o.x, now, false); })))));
      });
      if (!shown.length) {
        var filtered = filter !== 'all' || dayFilter;
        out.push(h('div', { class: 'empty' },
          h('h2', null, open.length && filtered ? 'Nothing matches' : 'All clear'),
          h('p', null, open.length && filtered ? 'Change the filter or pick another day to see the rest of your open tasks.' : 'Nothing is open right now.')));
      }
    }

    if (done.length) {
      done.sort(function (a, b) { return String(b.doneAt || '').localeCompare(String(a.doneAt || '')); });
      var bar = confirmClear
        ? h('div', { class: 'bar' }, h('span', null, 'Delete ' + done.length + ' completed ' + (done.length === 1 ? 'task' : 'tasks') + '?'),
            h('button', { type: 'button', class: 'ghost', onclick: function () { confirmClear = false; removeTasks(done.map(function (t) { return t.id; })); } }, 'Delete all'),
            h('button', { type: 'button', class: 'ghost', onclick: function () { confirmClear = false; render(); } }, 'Keep'))
        : h('div', { class: 'bar' }, h('button', { type: 'button', class: 'ghost', onclick: function () { confirmClear = true; render(); } }, 'Clear completed'));
      var det = h('details', { class: 'completed' },
        h('summary', null, 'Completed (' + done.length + ')'),
        bar,
        h.apply(null, ['ul', { class: 'tasks' }].concat(done.map(function (t) { return taskRow(t, info(t, now), now, true); }))));
      if (doneOpen) det.open = true;
      det.addEventListener('toggle', function () { doneOpen = det.open; });
      out.push(det);
    }
    listEl.replaceChildren.apply(listEl, out);
  }

  /* ---------- start ---------- */
  syncTime();
  render();
  setInterval(render, 60000);

  (async function init() {
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) {
      try { tasks = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { tasks = []; }
      if (!Array.isArray(tasks)) tasks = [];
      loaded = true;
      setStatus('saved', 'Saved on this device');
      render();
      return;
    }
    col = db.collection('tasks');
    col.onSnapshot(function (snap) {
      tasks = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded = true;
      if (saveEl.dataset.state === 'connecting') setStatus('saved', 'Saved');
      render();
    }, function () {
      loaded = true;
      setStatus('error', 'Lost connection to storage. Reload the page.');
      render();
    });
  })();
})();
</script>
</body>
</html>
